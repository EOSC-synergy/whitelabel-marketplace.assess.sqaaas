config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/cessda/whitelabel-marketplace:
      branch: cessda-customisations
      repo: https://github.com/cessda/whitelabel-marketplace
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/cessda/whitelabel-marketplace git:
        commands:
        - /usr/bin/env sh .sqa/script.bronze_dramatic_lobster.sh
        container: qc.acc_magenta_carefree_spider
  QC.Doc:
    repos:
      github.com/cessda/whitelabel-marketplace find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.marina_vibrant_roadrunner.sh
        container: qc.doc_pansy_bewildered_turtle
      github.com/cessda/whitelabel-marketplace git:
        commands:
        - /usr/bin/env sh .sqa/script.scarlet_productive_tiger.sh
        container: qc.doc_cerulean_harmonious_marmoset
      github.com/cessda/whitelabel-marketplace markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.mango_delighted_uakari.sh
        container: qc.doc_saffron_silly_cassowary
  QC.Lic:
    repos:
      github.com/cessda/whitelabel-marketplace licensee:
        commands:
        - /usr/bin/env sh .sqa/script.flax_grumpy_dormouse.sh
        container: qc.lic_glaucous_authentic_gecko
  QC.Sty:
    repos:
      github.com/cessda/whitelabel-marketplace hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.fern_bright_kookaburra.sh
        container: qc.sty_sage_insightful_reindeer
      github.com/cessda/whitelabel-marketplace jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.cinnabar_studious_kingfisher.sh
        container: qc.sty_grape_focused_toucan
      github.com/cessda/whitelabel-marketplace rubocop:
        commands:
        - /usr/bin/env sh .sqa/script.ochre_imaginative_gibbon.sh
        container: qc.sty_fuchsia_outgoing_dugong
  QC.Ver:
    repos:
      github.com/cessda/whitelabel-marketplace get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.gold_carefree_coyote.sh
        container: qc.ver_dahlia_mischievous_weasel
timeout: 5400
